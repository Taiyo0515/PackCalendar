workflows:
  ios-unsigned:
    name: PackCalendar iOS (SideStore)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Build unsigned IPA
        script: bash scripts/build-ios.sh
      - name: Publish tagged build to GitHub Releases
        script: node scripts/publish-ios.mjs
    artifacts:
      - build/ios/PackCalendar-unsigned.ipa
      - build/ios/xcodebuild.log
