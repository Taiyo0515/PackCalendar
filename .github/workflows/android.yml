name: Build Android APK
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_PUSH_URL: ${{ vars.VITE_PUSH_URL }}
      - run: npx cap sync android
      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: PackCalendar-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          cd android/app/build/outputs/apk/release
          cp app-release.apk "PackCalendar-$VERSION.apk"
          sha256sum "PackCalendar-$VERSION.apk" > "PackCalendar-$VERSION.apk.sha256"
          gh release create "$GITHUB_REF_NAME" PackCalendar-$VERSION.apk* \
            --title "$GITHUB_REF_NAME" --notes "Android APK（通知・ウィジェット・カレンダー取り込み入り）"
